<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Balloon Pop Game 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:#fef6e4;
  font-family:'Poppins',sans-serif;
}

/* BALLOON CANVAS */
#gameCanvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:1;
}

/* SCORE */
#scoreBox {
  position:fixed;
  top:20px; left:20px;
  background:white;
  padding:15px 25px;
  border-radius:15px;
  font-size:22px;
  font-weight:700;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  z-index:3;
}

/* CANDLE SCREEN */
#candleScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#000000d0;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:4;
  text-align:center;
}

#cake {
  width:220px;
  margin-bottom:20px;
}

#blowBtn {
  padding:15px 30px;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:#ffcc00;
  color:black;
  cursor:pointer;
  font-weight:700;
}

/* FINAL POLAROID FLOAT */
#photoReveal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:#000;
  display:none;
  overflow:hidden;
  z-index:5;
}

.polaroid {
  position:absolute;
  width:180px;
  padding:10px;
  background:white;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  transform:rotate(-5deg);
  animation:float 12s infinite ease-in-out;
}

.polaroid img {
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:8px;
}

@keyframes float {
  0% { transform:translateY(0) rotate(-5deg); }
  50% { transform:translateY(-40px) rotate(5deg); }
  100% { transform:translateY(0) rotate(-5deg); }
}

/* MESSAGE */
#finalMessage {
  position:fixed;
  bottom:40px;
  width:100%;
  text-align:center;
  color:white;
  font-size:26px;
  font-weight:600;
  text-shadow:0 0 15px gold;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="scoreBox">Balloons popped: <span id="score">0</span>/15</div>

<!-- CANDLE SCREEN -->
<div id="candleScreen">
  <img id="cake" src="https://i.imgur.com/8bZQZQp.png">
  <h2>Make a wish, Haridhra…</h2>
  <button id="blowBtn" onclick="blowCandles()">Blow the candles 🎂</button>
</div>

<!-- PHOTO REVEAL -->
<div id="photoReveal">
  <div id="finalMessage">Happy Birthday, Haridhra 💛</div>
</div>

<script>
/* CANVAS SETUP */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* BALLOONS */
let balloons = [];
let score = 0;
const target = 15;

function rand(min,max){ return Math.random()*(max-min)+min; }

function spawnBalloon(){
  balloons.push({
    x: rand(50, canvas.width-50),
    y: canvas.height + 50,
    size: rand(40,70),
    speed: rand(1.2,2.5),
    color: `hsl(${rand(0,360)},100%,60%)`
  });
}
setInterval(spawnBalloon, 700);

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  balloons.forEach((b,i)=>{
    b.y -= b.speed;

    ctx.beginPath();
    ctx.fillStyle = b.color;
    ctx.ellipse(b.x, b.y, b.size*0.7, b.size, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.size);
    ctx.lineTo(b.x, b.y + b.size + 40);
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.stroke();

    if(b.y < -100){
      balloons.splice(i,1);
    }
  });

  requestAnimationFrame(draw);
}
draw();

/* POP BALLOONS */
canvas.addEventListener("click", function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  balloons.forEach((b,i)=>{
    const dx = mx - b.x;
    const dy = my - b.y;
    if(Math.sqrt(dx*dx + dy*dy) < b.size){
      balloons.splice(i,1);
      score++;
      document.getElementById("score").innerText = score;

      if(score >= target){
        setTimeout(()=>document.getElementById("candleScreen").style.display="flex", 500);
      }
    }
  });
});

/* CANDLE BLOW */
function blowCandles(){
  document.getElementById("candleScreen").style.display="none";
  startPhotoReveal();
}

/* PHOTO REVEAL WITH HARIDHRA1–3.JPG */
function startPhotoReveal(){
  const container = document.getElementById("photoReveal");
  container.style.display = "block";

  const files = ["Haridhra1.jpg","Haridhra2.jpg","Haridhra3.jpg"];

  files.forEach((file,i)=>{
    const p = document.createElement("div");
    p.className = "polaroid";
    p.style.left = rand(0, window.innerWidth-200) + "px";
    p.style.top = rand(0, window.innerHeight-300) + "px";
    p.style.animationDelay = (i * 0.7) + "s";

    p.innerHTML = `<img src="${file}">`;
    container.appendChild(p);
  });
}
</script>

</body>
</html>
