<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Haridhra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
  text-align:center;
}

/* Background slideshow */
.bg {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:blur(6px) brightness(0.6);
  animation:slide 25s infinite;
  z-index:-2;
}

@keyframes slide {
  0%   {background-image:url('food.jpg');}
  20%  {background-image:url('travel.jpg');}
  40%  {background-image:url('animals.jpg');}
  60%  {background-image:url('luck.jpg');}
  80%  {background-image:url('surprise.jpg');}
  100% {background-image:url('food.jpg');}
}

/* Gold glow title */
h1 {
  margin-top:60px;
  font-size:48px;
  font-weight:700;
  color:#ffcc00;
  text-shadow:0 0 20px #ffcc00;
}

/* Card */
.card {
  background:rgba(0,0,0,0.55);
  padding:30px;
  border-radius:25px;
  width:85%;
  max-width:800px;
  margin:40px auto;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}

/* Slideshow */
.slideshow {
  position:relative;
  width:260px;
  height:260px;
  margin:0 auto;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #ffcc00;
  box-shadow:0 0 25px rgba(255,204,0,0.7);
}

.slideshow img {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  animation:fade 12s infinite;
}

.slideshow img:nth-child(1){animation-delay:0s;}
.slideshow img:nth-child(2){animation-delay:4s;}
.slideshow img:nth-child(3){animation-delay:8s;}

@keyframes fade {
  0%{opacity:0;}
  10%{opacity:1;}
  30%{opacity:1;}
  40%{opacity:0;}
  100%{opacity:0;}
}

/* Typewriter */
#message {
  font-size:20px;
  line-height:1.8;
  margin-top:20px;
  min-height:200px;
  white-space:pre-wrap;
  color:#fff;
}

/* Signature */
.signature {
  margin-top:15px;
  font-style:italic;
  font-weight:bold;
  color:#ffcc00;
}

/* Fireworks */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:-1;
}
</style>
</head>

<body>

<div class="bg"></div>

<h1>🎉 Happy Birthday Haridhra 🎉</h1>

<div class="card">
  <div class="slideshow">
    <img src="Haridhra1.jpg">
    <img src="Haridhra2.jpg">
    <img src="Haridhra3.jpg">
  </div>

  <p id="message"></p>

  <p class="signature">— With all my love, Your Big Brother, Sriram</p>
</div>

<canvas id="fireworks"></canvas>

<audio id="voice" src="https://www.soundjay.com/human/sounds/happy-birthday-01.mp3"></audio>

<script>
/* Typewriter message */
const text = `Happy Birthday, Haridhra ❤️

Today is all about you.

Your smile, your kindness, your energy —
you brighten every room you walk into.

You deserve joy.
You deserve love.
You deserve every good thing coming your way.

Never forget how special you are.

Happy Birthday, superstar ✨`;

let i = 0;
function typeWriter(){
  if(i < text.length){
    const char = text.charAt(i);
    document.getElementById("message").innerHTML += char === "\n" ? "<br>" : char;
    i++;
    setTimeout(typeWriter, 35);
  }
}
typeWriter();

/* Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let fw = [];

function create(){
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height/2;
  const colors = ["#ffffff","#ffcc00","#ff9900","#ff6600"];
  for(let i=0;i<40;i++){
    fw.push({
      x,y,
      radius:2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*3+1,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:60
    });
  }
}

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  fw.forEach((p,i)=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.life--;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    if(p.life<=0) fw.splice(i,1);
  });
  requestAnimationFrame(animate);
}

setInterval(create,800);
animate();

/* Play music */
document.getElementById("voice").play().catch(()=>{});
</script>

</body>
</html>
