<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Booking</title>

<style>

body{
margin:0;
font-family:system-ui, Arial;
background:#f5f7fb;
color:#111;
}

/* APP CONTAINER */
.app{
max-width:420px;
margin:auto;
min-height:100vh;
background:white;
}

/* HEADER */
.header{
padding:16px;
background:#2563eb;
color:white;
font-weight:600;
}

/* SCREEN */
.screen{
display:none;
padding:20px;
}

.active{display:block;}

/* INPUTS */
input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

/* FLIGHT CARD */
.card{
border:1px solid #eee;
border-radius:12px;
padding:14px;
margin:10px 0;
display:flex;
justify-content:space-between;
align-items:center;
}

.price{
color:#16a34a;
font-weight:700;
}

/* BOARDING PASS */
.pass{
border:1px dashed #ccc;
padding:16px;
border-radius:12px;
text-align:center;
}

.face{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
margin:10px 0;
border:2px solid #2563eb;
}

/* MAP */
.map{
height:200px;
background:linear-gradient(135deg,#dbeafe,#f0f9ff);
border-radius:12px;
position:relative;
overflow:hidden;
}

.plane{
position:absolute;
font-size:26px;
left:10%;
top:50%;
transition:5s linear;
}

/* CAKE */
.cake{
width:160px;
height:100px;
background:#ffb6c1;
margin:auto;
border-radius:12px;
position:relative;
margin-top:30px;
}

.candle{
position:absolute;
width:8px;
height:30px;
background:white;
top:-30px;
}

.flame{
width:10px;
height:14px;
background:orange;
border-radius:50%;
position:absolute;
top:-14px;
animation:flicker .2s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(.8);}
}

/* FINAL */
.final{
text-align:center;
padding:30px;
font-weight:600;
}

</style>
</head>

<body>

<div class="app">

<div class="header">✈️ Sky Travel</div>

<!-- SEARCH -->
<div id="s1" class="screen active">

<h3>Search Flights</h3>

<input value="India (MAA)">
<input value="London (LHR)">

<button onclick="search()">Search</button>

</div>

<!-- RESULTS -->
<div id="s2" class="screen">

<h3>Available Flights</h3>

<div class="card">
<div>
Direct Flight<br>
<small>9h 10m</small>
</div>
<div class="price">£240</div>
</div>

<div class="card">
<div>
1 Stop Flight<br>
<small>11h 30m</small>
</div>
<div class="price">£180</div>
</div>

<button onclick="book()">Book Selected</button>

</div>

<!-- PASS -->
<div id="s3" class="screen">

<div class="pass">

<h3>Boarding Pass</h3>

<p>India → London</p>

<img class="face" src="Haridhra1.jpg">

<p>Passenger: Haridhra</p>

<button onclick="fly()">Check In</button>

</div>

</div>

<!-- FLIGHT -->
<div id="s4" class="screen">

<h3>Flight in Progress</h3>

<div class="map">
<div id="plane" class="plane">✈️</div>
</div>

</div>

<!-- CAKE -->
<div id="s5" class="screen">

<h3>Arrival 🎉</h3>

<div class="cake">

<div class="candle" style="left:30px"><div class="flame"></div></div>
<div class="candle" style="left:70px"><div class="flame"></div></div>
<div class="candle" style="left:110px"><div class="flame"></div></div>

</div>

<button onclick="end()">Celebrate</button>

</div>

<!-- FINAL -->
<div id="s6" class="screen">

<div class="final">
💛 Happy Birthday Haridhra 💛<br><br>

A journey from India → London<br>
Made real in moments ✈️
</div>

</div>

</div>

<script>

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function search(){ show("s2"); }

function book(){ show("s3"); }

function fly(){

show("s4");

setTimeout(()=>{
document.getElementById("plane").style.left="85%";
document.getElementById("plane").style.top="20%";
},500);

setTimeout(()=>{
show("s5");
},5000);

}

function end(){

document.querySelectorAll(".flame").forEach(f=>{
f.style.opacity="0";
});

show("s6");

}

</script>

</body>
</html>
