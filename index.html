<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Would You Rather?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
  background:#000;
  color:#fff;
  text-align:center;
  overflow-x:hidden;
}

/* Gold/orange gradient */
.bg-gradient {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#ffcc00,#ff9900,#ff6600,#ff3300);
  background-size:400% 400%;
  animation:bgShift 12s ease infinite;
  z-index:-2;
}
@keyframes bgShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Background image */
.bg-photo {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  opacity:0.25;
  filter:blur(6px);
  transition:background-image 1s ease;
  z-index:-1;
}

h1 {
  margin-top:40px;
  font-size:42px;
  font-weight:700;
  color:#ffcc00;
}

#game-box {
  width:90%;
  max-width:600px;
  margin:40px auto;
  padding:25px;
  background:rgba(0,0,0,0.55);
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 5px 20px rgba(0,0,0,0.6);
}

.question {
  font-size:24px;
  font-weight:600;
  margin-bottom:25px;
}

.choice-btn {
  display:block;
  width:90%;
  margin:12px auto;
  padding:18px;
  font-size:20px;
  border:none;
  border-radius:15px;
  background:#fff;
  color:#333;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}
.choice-btn:hover {
  transform:scale(1.05);
  background:#ffe08a;
}

/* Surprise section */
#surprise-content {
  opacity:0;
  pointer-events:none;
  transition:opacity 2s ease;
}

.card {
  background:rgba(0,0,0,0.55);
  padding:30px;
  border-radius:25px;
  width:85%;
  max-width:800px;
  margin:40px auto;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.8);
}

/* Slideshow */
.slideshow {
  position:relative;
  width:260px;
  height:260px;
  margin:0 auto;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #ffcc00;
  box-shadow:0 0 25px rgba(255,204,0,0.7);
}
.slideshow img {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  animation:fadeCycle 9s infinite;
}
.slideshow img:nth-child(1){animation-delay:0s;}
.slideshow img:nth-child(2){animation-delay:3s;}
.slideshow img:nth-child(3){animation-delay:6s;}

@keyframes fadeCycle {
  0%{opacity:0;}
  10%{opacity:1;}
  30%{opacity:1;}
  40%{opacity:0;}
  100%{opacity:0;}
}

#message {
  font-size:20px;
  line-height:1.8;
  margin-top:20px;
  min-height:200px;
  white-space:pre-wrap;
}

.signature {
  margin-top:15px;
  font-style:italic;
  font-weight:bold;
  color:#ffcc00;
}

/* Fireworks */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:-1;
}
</style>
</head>

<body>

<div class="bg-gradient"></div>
<div class="bg-photo" id="bg-photo"></div>

<h1 id="title">Would You Rather?</h1>

<div id="game-box">
  <div id="question-container"></div>
</div>

<!-- Surprise Content -->
<div id="surprise-content">
  <canvas id="fireworks"></canvas>

  <h1>🎉 Happy Birthday Haridhra 🎉</h1>

  <div class="card">
    <div class="slideshow">
      <img src="Haridhra1.jpg">
      <img src="Haridhra2.jpg">
      <img src="Haridhra3.jpg">
    </div>
    <p id="message"></p>
    <p class="signature">— With all my love, Your Big Brother, Sriram</p>
  </div>

  <audio id="voice" src="https://www.soundjay.com/human/sounds/happy-birthday-01.mp3"></audio>
</div>

<script>
/* CLEAN QUESTIONS — no apostrophes */
const questions = [
  {
    q: "Would you rather…",
    a: ["Accidentally like someones 2014 Instagram post", "Say you too when the waiter says enjoy your meal"]
  },
  {
    q: "Would you rather…",
    a: ["Have your phone die at 1 percent every day", "Have WiFi that only works in one corner of your house"]
  },
  {
    q: "Would you rather…",
    a: ["Fight one horse sized duck", "Fight 50 duck sized horses"]
  },
  {
    q: "Would you rather…",
    a: ["Have a sneeze stuck for 3 hours", "Have hiccups during every serious conversation"]
  },
  {
    q: "Final one…",
    a: ["See normal results like a sensible human", "Unlock the special surprise made ONLY for the birthday girl"]
  }
];

/* Background images */
const bgImages = [
  "food.jpg",
  "travel.jpg",
  "animals.jpg",
  "luck.jpg",
  "surprise.jpg"
];

let current = 0;

function loadQuestion(){
  const qBox = document.getElementById("question-container");
  const bg = document.getElementById("bg-photo");

  if(current >= questions.length){
    revealSurprise();
    return;
  }

  const q = questions[current];
  bg.style.backgroundImage = `url('${bgImages[current]}')`;

  qBox.innerHTML = `
    <div class="question">${q.q}</div>
    ${q.a.map(ans => `<button class="choice-btn" onclick="nextQuestion('${ans}')">${ans}</button>`).join("")}
  `;
}

function nextQuestion(choice){
  if(choice.includes("special surprise")){
    revealSurprise();
    return;
  }
  current++;
  loadQuestion();
}

loadQuestion();

/* Surprise reveal */
function revealSurprise(){
  document.getElementById("game-box").style.display="none";
  document.getElementById("title").style.display="none";

  const sc = document.getElementById("surprise-content");
  sc.style.opacity = 1;
  sc.style.pointerEvents = "auto";

  startShow();
}

/* Typewriter message */
const text = `You chose the surprise…

And honestly, that makes sense.

Because YOU are the surprise.
You are the joy.
You are the brightness.
You are the reason today is special.

So here it is…

A birthday message made just for you.

Happy Birthday, Haridhra ❤️`;

let i = 0;
function typeWriter(){
  if(i < text.length){
    const char = text.charAt(i);
    document.getElementById("message").innerHTML += char === "\n" ? "<br>" : char;
    i++;
    setTimeout(typeWriter, 25);
  }
}

/* Fireworks */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.onresize = resizeCanvas;

let fireworks = [];

function createFirework(){
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height/2;
  const colors = ["#ffffff","#ffcc00","#ff9900","#ff6600"];
  for(let i=0;i<40;i++){
    fireworks.push({
      x,y,
      radius:2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*3+1,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:60
    });
  }
}

function animateFireworks(){
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  fireworks.forEach((f,index)=>{
    f.x+=Math.cos(f.angle)*f.speed;
    f.y+=Math.sin(f.angle)*f.speed;
    f.life--;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
    ctx.fillStyle=f.color;
    ctx.fill();
    if(f.life<=0) fireworks.splice(index,1);
  });
  requestAnimationFrame(animateFireworks);
}

function startShow(){
  typeWriter();
  document.getElementById("voice").play().catch(()=>{});
  animateFireworks();
  setInterval(createFirework,800);
}
</script>

</body>
</html>
