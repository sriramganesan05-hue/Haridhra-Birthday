<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Balloon Pop Game 🎈</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  overflow:hidden;
  background:#fef6e4;
  font-family:'Poppins',sans-serif;
}

/* BALLOON CANVAS */
#gameCanvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  z-index:1;
}

/* SCORE */
#scoreBox {
  position:fixed;
  top:20px; left:20px;
  background:white;
  padding:15px 25px;
  border-radius:15px;
  font-size:22px;
  font-weight:700;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  z-index:3;
}

/* FINAL SCREEN */
#finalScreen {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.85);
  color:white;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:5;
  text-align:center;
}

#finalScreen img {
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:20px;
  box-shadow:0 0 25px gold;
}

#finalScreen h1 {
  font-size:40px;
  margin-bottom:10px;
}

#finalScreen p {
  font-size:20px;
  width:80%;
  max-width:500px;
  line-height:1.6;
}

/* POP TEXT */
.popText {
  position:absolute;
  font-size:28px;
  font-weight:700;
  color:#ff3b3b;
  pointer-events:none;
  animation:popFade 1s ease forwards;
}

@keyframes popFade {
  0% { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-40px); }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="scoreBox">Balloons popped: <span id="score">0</span>/15</div>

<div id="finalScreen">
  <img src="Haridhra1.jpg">
  <h1>🎉 YOU DID IT! 🎉</h1>
  <p>
    Happy Birthday Haridhra!  
    You popped every balloon like an absolute legend.  
    You’re fun, chaotic, adorable, and today is YOUR day 💛  
  </p>
  <p style="margin-top:20px; font-weight:bold;">
    — From your favourite chaos machine, Sriram 😎
  </p>
</div>

<script>
/* CANVAS SETUP */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* BALLOON OBJECTS */
let balloons = [];
let score = 0;
const target = 15;

/* RANDOM HELPERS */
function rand(min,max){ return Math.random()*(max-min)+min; }

/* CREATE BALLOONS */
function spawnBalloon(){
  balloons.push({
    x: rand(50, canvas.width-50),
    y: canvas.height + 50,
    size: rand(40,70),
    speed: rand(1.2,2.5),
    color: `hsl(${rand(0,360)},100%,60%)`
  });
}

setInterval(spawnBalloon, 700);

/* DRAW LOOP */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  balloons.forEach((b,i)=>{
    b.y -= b.speed;

    ctx.beginPath();
    ctx.fillStyle = b.color;
    ctx.ellipse(b.x, b.y, b.size*0.7, b.size, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.size);
    ctx.lineTo(b.x, b.y + b.size + 40);
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 2;
    ctx.stroke();

    if(b.y < -100){
      balloons.splice(i,1);
    }
  });

  requestAnimationFrame(draw);
}
draw();

/* POP BALLOONS */
canvas.addEventListener("click", function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  balloons.forEach((b,i)=>{
    const dx = mx - b.x;
    const dy = my - b.y;
    if(Math.sqrt(dx*dx + dy*dy) < b.size){
      balloons.splice(i,1);
      score++;
      document.getElementById("score").innerText = score;

      showPopText(mx,my);

      if(score >= target){
        setTimeout(showFinal, 500);
      }
    }
  });
});

/* POP TEXT */
function showPopText(x,y){
  const t = document.createElement("div");
  t.className = "popText";
  t.style.left = x + "px";
  t.style.top = y + "px";
  t.innerText = "POP!";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1000);
}

/* FINAL SCREEN */
function showFinal(){
  document.getElementById("finalScreen").style.display = "flex";
}
</script>

</body>
</html>
