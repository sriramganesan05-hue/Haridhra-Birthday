<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Story ✈️💛</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:linear-gradient(135deg,#fff2d6,#ffd6e7,#e6f3ff);
}

.scene{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

.active{ display:flex; }

.character{
position:absolute;
display:flex;
flex-direction:column;
align-items:center;
animation:float 2s infinite ease-in-out;
}

.face{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.body{width:6px;height:60px;background:#333;}

.arm,.leg{
width:40px;height:5px;background:#333;
position:absolute;
}

.arm.left{transform:rotate(30deg);top:90px;left:-20px;}
.arm.right{transform:rotate(-30deg);top:90px;right:-20px;}
.leg.left{transform:rotate(30deg);top:140px;left:-15px;}
.leg.right{transform:rotate(-30deg);top:140px;right:-15px;}

@keyframes float{
50%{transform:translateY(-10px);}
}

.plane{
font-size:50px;
position:absolute;
left:-100px;
top:50%;
animation:fly 6s linear forwards;
}

@keyframes fly{to{left:110%;}}

.route{
position:absolute;
top:60%;
width:80%;
height:3px;
background:#333;
}

.dot{
width:12px;height:12px;
border-radius:50%;
background:red;
position:absolute;
top:calc(60% - 6px);
}

.cake{
width:200px;height:120px;
background:pink;
border-radius:20px;
position:relative;
}

.candle{
width:10px;height:40px;background:white;
position:absolute;top:-40px;
}

.flame{
width:14px;height:20px;
background:gold;
border-radius:50%;
position:absolute;
top:-20px;
left:-2px;
animation:flicker .2s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(.8);}
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:#ff5f8f;
color:white;
font-size:16px;
cursor:pointer;
}

#message{
font-size:30px;
font-weight:bold;
text-align:center;
color:#6b3b3b;
padding:20px;
}

.confetti{
position:absolute;
width:10px;
height:10px;
animation:fall 4s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>

<body>

<!-- SCENE 1 -->
<div id="scene1" class="scene active">
<h1>✈️ London → Chennai Journey</h1>
<div class="route"></div>
<div class="dot"></div>
<div class="plane">✈️</div>
<button onclick="goScene2()">Start Journey</button>
</div>

<!-- SCENE 2 -->
<div id="scene2" class="scene">

<div class="character" id="me">
<img class="face" src="me.jpg">
<div class="body"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="leg left"></div>
<div class="leg right"></div>
</div>

<div class="character" id="her" style="right:80px; top:50%;">
<img class="face" id="herFace" src="Haridhra1.jpg">
<div class="body"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="leg left"></div>
<div class="leg right"></div>
</div>

<button onclick="goScene3()">Meet ❤️</button>
</div>

<!-- SCENE 3 -->
<div id="scene3" class="scene">

<h2>Birthday Celebration 🎂</h2>

<div class="cake">
<div class="candle" style="left:40px"><div class="flame"></div></div>
<div class="candle" style="left:80px"><div class="flame"></div></div>
<div class="candle" style="left:120px"><div class="flame"></div></div>
</div>

<button onclick="blow()">Blow Candles 🕯️</button>
</div>

<!-- SCENE 4 -->
<div id="scene4" class="scene">

<div id="message">
Happy Birthday Haridhra 💛<br><br>
From London to Chennai ✈️<br>
Distance means nothing
</div>

</div>

<script>

function show(id){
document.querySelectorAll(".scene").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* ---------- HER IMAGE ROTATION ---------- */

let herImages = [
"Haridhra1.jpg",
"Haridhra2.jpg",
"Haridhra3.jpg"
];

let herIndex = 0;

setInterval(()=>{
document.getElementById("herFace").src = herImages[herIndex];
herIndex = (herIndex + 1) % herImages.length;
},1200);

/* ---------- FLOW ---------- */

function goScene2(){
show("scene2");
}

function goScene3(){
show("scene3");
}

function blow(){

document.querySelectorAll(".flame").forEach(f=>{
f.style.opacity="0";
});

setTimeout(()=>{
show("scene4");
launchConfetti();
},1200);

}

/* ---------- CONFETTI ---------- */

function launchConfetti(){

for(let i=0;i<120;i++){

let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.background=`hsl(${Math.random()*360},100%,60%)`;
c.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(c);

}

}

</script>

</body>
</html>
