<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Personality Check</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
  background:#eef2f7;
  color:#222;
  text-align:center;
  transition:1.5s ease;
  overflow-x:hidden;
}

h1 {
  margin-top:40px;
  font-size:40px;
  color:#1a3d7c;
  transition:1.5s ease;
}

#quiz-box {
  width:90%;
  max-width:600px;
  margin:30px auto;
  padding:25px;
  background:#ffffff;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.question {
  font-size:22px;
  font-weight:600;
  margin-bottom:20px;
}

.answer-btn {
  display:block;
  width:90%;
  margin:10px auto;
  padding:15px;
  font-size:18px;
  border:none;
  border-radius:15px;
  background:#1a3d7c;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.answer-btn:hover {
  background:#0f2a55;
  transform:scale(1.03);
}

#progress {
  margin-top:20px;
  font-size:16px;
  color:#555;
}

/* Surprise Mode */
.surprise {
  background:linear-gradient(135deg,#1a3d7c,#3a7bd5,#00d2ff,#f7b733,#fc4a1a);
  background-size:500% 500%;
  animation:bgShift 10s ease infinite;
  color:#fff;
}

@keyframes bgShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

#surprise-content {
  opacity:0;
  pointer-events:none;
  transition:opacity 2s ease;
}

.card {
  background:rgba(255,255,255,0.15);
  padding:30px;
  border-radius:25px;
  width:85%;
  max-width:800px;
  margin:auto;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.card img {
  width:260px;
  height:260px;
  border-radius:50%;
  object-fit:cover;
  opacity:0;
  animation:fadeIn 2s ease forwards, glow 3s ease-in-out infinite alternate;
  border:4px solid #fff;
  box-shadow:0 0 25px rgba(255,255,255,0.7);
}

@keyframes fadeIn {
  from{opacity:0;transform:scale(0.8);}
  to{opacity:1;transform:scale(1);}
}

@keyframes glow {
  from{box-shadow:0 0 15px rgba(255,255,255,0.4);}
  to{box-shadow:0 0 35px rgba(255,255,255,1);}
}

#message {
  font-size:20px;
  line-height:1.8;
  margin-top:20px;
  min-height:200px;
  white-space:pre-wrap;
}

.signature {
  margin-top:15px;
  font-style:italic;
  font-weight:bold;
  color:#fff;
}

/* Fireworks */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:0;
}
</style>
</head>

<body>

<h1 id="title">Quick Personality Check</h1>

<div id="quiz-box">
  <div id="question-container"></div>
  <div id="progress"></div>
</div>

<!-- Surprise Content -->
<div id="surprise-content">
  <canvas id="fireworks"></canvas>

  <h1>🎉 Happy Birthday Haridhra 🎉</h1>

  <div class="card">
    <img src="Haridhra.jpg">
    <p id="message"></p>
    <p class="signature">— With all my love, Your Big Brother, Sriram</p>
  </div>

  <audio id="voice" src="https://www.soundjay.com/human/sounds/happy-birthday-01.mp3"></audio>
</div>

<script>
/* FUN QUESTIONS */
const questions = [
  {
    q: "Someone texts you at 2 AM saying they’re sad. What do you do?",
    a: ["Reply instantly", "Call them", "Show up with snacks"]
  },
  {
    q: "What’s your secret superpower?",
    a: ["Making people feel safe", "Making people laugh", "Being effortlessly lovable"]
  },
  {
    q: "How do people feel when you walk into a room?",
    a: ["Relieved", "Happier", "Like the main character arrived"]
  },
  {
    q: "Pick the word that fits you best:",
    a: ["Warm", "Genuine", "Unforgettable"]
  },
  {
    q: "How often do you accidentally make someone’s day better?",
    a: ["Every day", "More than you notice", "Literally always"]
  }
];

let current = 0;

function loadQuestion(){
  const qBox = document.getElementById("question-container");
  const p = document.getElementById("progress");

  if(current >= questions.length){
    revealSurprise();
    return;
  }

  const q = questions[current];

  qBox.innerHTML = `
    <div class="question">${q.q}</div>
    ${q.a.map(ans => `<button class="answer-btn" onclick="nextQuestion()">${ans}</button>`).join("")}
  `;

  p.innerHTML = `Question ${current+1} of ${questions.length}`;
}

function nextQuestion(){
  current++;
  loadQuestion();
}

loadQuestion();

/* SURPRISE REVEAL */
function revealSurprise(){
  document.body.classList.add("surprise");
  document.getElementById("quiz-box").style.display="none";
  document.getElementById("title").style.display="none";

  const sc = document.getElementById("surprise-content");
  sc.style.opacity = 1;
  sc.style.pointerEvents = "auto";

  startShow();
}

/* TYPEWRITER MESSAGE */
const text = `Your answers were perfect…

Because you ARE the person who shows up for others.
You ARE the person who makes people feel safe.
You ARE the person who brightens rooms.
You ARE unforgettable.
You ARE loved more than you realise.

And today…

You deserve the happiest birthday ever.

Happy Birthday, Haridhra ❤️`;

let i = 0;
function typeWriter(){
  if(i < text.length){
    const char = text.charAt(i);
    document.getElementById("message").innerHTML += char === "\n" ? "<br>" : char;
    i++;
    setTimeout(typeWriter, 25);
  }
}

/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.onresize = resizeCanvas;

let fireworks = [];

function createFirework(){
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height/2;
  const colors = ["#ffffff","#ffe066","#00d2ff","#3a7bd5","#f7b733"];
  for(let i=0;i<40;i++){
    fireworks.push({
      x,y,
      radius:2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*3+1,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:60
    });
  }
}

function animateFireworks(){
  ctx.fillStyle="rgba(0,0,0,0.1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  fireworks.forEach((f,index)=>{
    f.x+=Math.cos(f.angle)*f.speed;
    f.y+=Math.sin(f.angle)*f.speed;
    f.life--;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
    ctx.fillStyle=f.color;
    ctx.fill();
    if(f.life<=0) fireworks.splice(index,1);
  });
  requestAnimationFrame(animateFireworks);
}

function startShow(){
  typeWriter();
  document.getElementById("voice").play().catch(()=>{});
  animateFireworks();
  setInterval(createFirework,800);
}
</script>

</body>
</html>
