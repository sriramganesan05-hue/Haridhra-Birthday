<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Haridhra 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffecd2,#fcb69f);
}

#welcome{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:10;
}

#welcome h1{
font-size:3rem;
color:#ff4081;
margin-bottom:15px;
}

#welcome p{
font-size:1.2rem;
color:#555;
margin-bottom:25px;
}

.startBtn{
padding:15px 35px;
font-size:1.1rem;
border:none;
border-radius:50px;
background:#ff4081;
color:white;
cursor:pointer;
}

#cakeScene{
display:none;
position:absolute;
inset:0;
justify-content:center;
align-items:center;
flex-direction:column;
}

.title{
font-size:2rem;
font-weight:700;
color:#ff4081;
margin-bottom:20px;
}

#cakeWrap{
position:relative;
width:300px;
height:260px;
}

.cake{
position:absolute;
bottom:0;
width:300px;
height:160px;
background:#ffb6c1;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.2);
}

.cake:before{
content:"";
position:absolute;
top:40px;
width:100%;
height:15px;
background:white;
}

.cake:after{
content:"";
position:absolute;
top:80px;
width:100%;
height:15px;
background:white;
}

.candle{
position:absolute;
width:14px;
height:60px;
background:white;
top:40px;
}

.flame{
position:absolute;
width:18px;
height:25px;
background:gold;
border-radius:50% 50% 50% 50%;
top:-20px;
left:-2px;
box-shadow:0 0 20px orange;
animation:flicker .15s infinite alternate;
}

@keyframes flicker{
from{
transform:scale(1);
}
to{
transform:scale(.85);
}
}

#instruction{
margin-top:30px;
font-size:1.3rem;
color:#333;
}

#blowBtn{
margin-top:20px;
padding:15px 30px;
border:none;
border-radius:30px;
font-size:1rem;
background:#ffcc00;
font-weight:700;
cursor:pointer;
}

#celebration{
display:none;
position:absolute;
inset:0;
background:#000;
overflow:hidden;
}

.polaroid{
position:absolute;
width:180px;
background:white;
padding:10px;
border-radius:12px;
box-shadow:0 10px 25px rgba(255,255,255,.15);
opacity:0;
animation:drop 1s forwards,
float 8s ease-in-out infinite;
}

.polaroid img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

@keyframes drop{
from{
transform:translateY(-500px) rotate(-15deg);
opacity:0;
}
to{
opacity:1;
}
}

@keyframes float{
50%{
transform:translateY(-25px);
}
}

#message{
position:absolute;
bottom:40px;
width:100%;
text-align:center;
color:white;
font-size:2rem;
font-weight:600;
text-shadow:0 0 20px gold;
padding:20px;
}

.confetti{
position:absolute;
width:10px;
height:10px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(120vh) rotate(720deg);
opacity:0;
}
}
</style>
</head>
<body>

<div id="welcome">
<h1>🎉 Happy Birthday Haridhra 🎉</h1>
<p>Make a wish and blow out the candles...</p>
<button class="startBtn" onclick="startBirthday()">Begin ✨</button>
</div>

<div id="cakeScene">

<div class="title">Happy Birthday 💛</div>

<div id="cakeWrap">

<div class="candle" style="left:40px;">
<div class="flame"></div>
</div>

<div class="candle" style="left:90px;">
<div class="flame"></div>
</div>

<div class="candle" style="left:140px;">
<div class="flame"></div>
</div>

<div class="candle" style="left:190px;">
<div class="flame"></div>
</div>

<div class="candle" style="left:240px;">
<div class="flame"></div>
</div>

<div class="cake"></div>

</div>

<div id="instruction">
Close your eyes and make a wish 🎂
</div>

<button id="blowBtn" onclick="blowCandles()">
Blow Candles 🕯️
</button>

</div>

<div id="celebration">
<div id="message">
Happy Birthday Haridhra 💛<br>
May all your wishes come true ✨
</div>
</div>

<script>

function startBirthday(){
document.getElementById("welcome").style.display="none";
document.getElementById("cakeScene").style.display="flex";
}

function blowCandles(){

document.querySelectorAll(".flame").forEach((f,i)=>{
setTimeout(()=>{
f.style.transition=".5s";
f.style.opacity="0";
f.style.transform="scale(0)";
},i*200);
});

setTimeout(()=>{
startCelebration();
},1500);

}

function startCelebration(){

document.getElementById("cakeScene").style.display="none";

const scene=document.getElementById("celebration");
scene.style.display="block";

launchConfetti();

const photos=[
"Haridhra1.jpg",
"Haridhra2.jpg",
"Haridhra3.jpg"
];

photos.forEach((photo,index)=>{

setTimeout(()=>{

let p=document.createElement("div");
p.className="polaroid";

p.style.left=Math.random()*75+"%";
p.style.top=Math.random()*55+"%";

p.innerHTML=`<img src="${photo}">`;

scene.appendChild(p);

},index*1200);

});

}

function launchConfetti(){

for(let i=0;i<150;i++){

let c=document.createElement("div");
c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.top="-20px";

c.style.background=
`hsl(${Math.random()*360},100%,60%)`;

c.style.animationDuration=
(Math.random()*3+2)+"s";

document.getElementById("celebration")
.appendChild(c);

}

}

</script>

</body>
</html>
