<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>London → Chennai ✈️ Birthday Journey</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

/* ---------- SCREEN SYSTEM ---------- */
.screen{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
}

.active{display:flex;}

/* ---------- BOARDING PASS ---------- */

.pass{
background:white;
color:black;
padding:25px;
border-radius:18px;
width:300px;
box-shadow:0 20px 60px rgba(0,0,0,.4);
animation:pop .6s ease;
}

@keyframes pop{
from{transform:scale(.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.tag{
font-size:12px;
opacity:.6;
}

.route{
font-size:22px;
font-weight:bold;
margin:10px 0;
}

.btn{
margin-top:15px;
padding:12px 20px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
cursor:pointer;
}

/* ---------- AIRPORT LOADING ---------- */

.loader{
width:70px;
height:70px;
border:5px solid #333;
border-top:5px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

/* ---------- SKY ---------- */

.sky{
background:linear-gradient(#1b2a49,#4f6d7a,#87ceeb);
overflow:hidden;
}

/* CLOUDS */

.cloud{
position:absolute;
background:white;
border-radius:50px;
opacity:.8;
animation:moveClouds 12s linear infinite;
}

@keyframes moveClouds{
from{left:-200px;}
to{left:110%;}
}

/* ---------- PLANE ---------- */

.plane{
position:absolute;
font-size:45px;
top:45%;
left:-100px;
animation:fly 7s linear forwards;
filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));
}

@keyframes fly{
0%{left:-100px;top:55%;}
50%{top:35%;}
100%{left:110%;top:45%;}
}

/* ---------- ARRIVAL ---------- */

.arrival{
text-align:center;
font-size:28px;
}

/* ---------- CAKE ---------- */

.cake{
width:200px;
height:120px;
background:pink;
border-radius:20px;
position:relative;
}

.candle{
width:10px;
height:40px;
background:white;
position:absolute;
top:-40px;
}

.flame{
width:14px;
height:20px;
background:gold;
border-radius:50%;
position:absolute;
top:-20px;
left:-2px;
animation:flicker .2s infinite alternate;
}

@keyframes flicker{
from{transform:scale(1);}
to{transform:scale(.8);}
}

/* ---------- FINAL ---------- */

.final{
text-align:center;
font-size:30px;
padding:20px;
}

/* CONFETTI */

.confetti{
position:absolute;
width:10px;
height:10px;
animation:fall 4s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

</style>
</head>

<body>

<!-- STEP 1 -->
<div id="s1" class="screen active">

<div class="pass">

<div class="tag">BOARDING PASS</div>

<div class="route">London ✈️ Chennai</div>

<p>Passenger: Someone Special 💛</p>

<button class="btn" onclick="goLoading()">
Check In
</button>

</div>

</div>

<!-- STEP 2 -->
<div id="s2" class="screen">

<div class="loader"></div>
<p>Checking in... preparing surprise flight ✈️</p>

</div>

<!-- STEP 3 SKY -->
<div id="s3" class="screen sky">

<div class="cloud" style="width:120px;height:60px;top:20%;"></div>
<div class="cloud" style="width:160px;height:70px;top:40%;"></div>
<div class="cloud" style="width:100px;height:50px;top:60%;"></div>

<div class="plane">✈️</div>

</div>

<!-- STEP 4 ARRIVAL -->
<div id="s4" class="screen">

<div class="arrival">
🛬 Landing in Chennai...<br><br>
Someone very special has arrived 💛
</div>

<button class="btn" onclick="birthday()">Continue</button>

</div>

<!-- STEP 5 CAKE -->
<div id="s5" class="screen">

<div class="cake">

<div class="candle" style="left:40px"><div class="flame"></div></div>
<div class="candle" style="left:80px"><div class="flame"></div></div>
<div class="candle" style="left:120px"><div class="flame"></div></div>

</div>

<button class="btn" onclick="blow()">Blow Candles 🎂</button>

</div>

<!-- FINAL -->
<div id="s6" class="screen">

<div class="final">
💛 Happy Birthday Haridhra 💛<br><br>

From London to Chennai ✈️<br>
Distance became a journey of love 💛
</div>

</div>

<script>

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* FLOW */

function goLoading(){
show("s2");

setTimeout(()=>{
show("s3");
},2000);

setTimeout(()=>{
show("s4");
},9000);
}

function birthday(){
show("s5");
}

function blow(){

document.querySelectorAll(".flame").forEach(f=>{
f.style.opacity="0";
});

show("s6");
confetti();

}

/* CONFETTI */

function confetti(){

for(let i=0;i<150;i++){

let c=document.createElement("div");
c.className="confetti";

c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,60%)`;
c.style.animationDuration=(Math.random()*3+2)+"s";

document.body.appendChild(c);

}

}

</script>

</body>
</html>
