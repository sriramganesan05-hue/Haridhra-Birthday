<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Haridhra 🎉💛</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  background:#fffbf0;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  text-align:center;
}

/* CONFETTI CANVAS */
#confetti {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:5;
}

/* CENTER BOX */
#box {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:40px;
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
  width:85%;
  max-width:500px;
  animation:pop 0.7s ease;
}

@keyframes pop {
  0% { transform:translate(-50%,-50%) scale(0); }
  70% { transform:translate(-50%,-50%) scale(1.15); }
  100% { transform:translate(-50%,-50%) scale(1); }
}

/* BOUNCE EMOJIS */
.bounce {
  display:inline-block;
  animation:bounce 1s infinite;
}

@keyframes bounce {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-12px); }
}

/* BUTTON */
button {
  margin-top:20px;
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#ffcc00;
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}
button:hover {
  transform:scale(1.1) rotate(2deg);
}

/* HIDDEN SURPRISE */
#surprise {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:85%;
  max-width:550px;
  background:white;
  padding:40px;
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
  display:none;
  animation:pop 0.7s ease;
}

#surprise img {
  width:200px;
  height:200px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(255,204,0,0.7);
}

#surprise h2 {
  font-size:28px;
  margin-bottom:10px;
}

#surprise p {
  font-size:18px;
  line-height:1.6;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div id="box">
  <h1>
    <span class="bounce">🎉</span>
    Happy Birthday Haridhra
    <span class="bounce">🎉</span>
  </h1>

  <p style="font-size:20px;">
    Ready for your chaotic surprise?
  </p>

  <button onclick="showSurprise()">YES, SHOW ME 😆</button>
</div>

<div id="surprise">
  <img src="Haridhra1.jpg">
  <h2>🎂 You amazing human 🎂</h2>
  <p>
    You are cute.  
    You are chaotic.  
    You are sunshine in human form.  
    And today is YOUR day 💛  
  </p>

  <p style="font-weight:bold; margin-top:10px;">
    — From your favourite chaos machine, Sriram 😎
  </p>
</div>

<script>
/* CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let confetti = [];

function createConfetti(){
  for(let i=0;i<10;i++){
    confetti.push({
      x:Math.random()*canvas.width,
      y:-10,
      size:Math.random()*8+4,
      speed:Math.random()*3+2,
      color:`hsl(${Math.random()*360},100%,60%)`,
      angle:Math.random()*2*Math.PI
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confetti.forEach((p,i)=>{
    p.y+=p.speed;
    p.x+=Math.sin(p.angle)*1.5;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
    if(p.y>canvas.height) confetti.splice(i,1);
  });
  requestAnimationFrame(animate);
}

setInterval(createConfetti,200);
animate();

/* SURPRISE POP-IN */
function showSurprise(){
  document.getElementById("box").style.display="none";
  document.getElementById("surprise").style.display="block";
}
</script>

</body>
</html>
