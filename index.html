<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Would You Rather?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffcf33,#ff914d,#ff4d6d,#ff6f91,#ff9671);
  background-size:400% 400%;
  animation:bgShift 10s ease infinite;
  color:#fff;
  text-align:center;
  transition:1.5s ease;
  overflow-x:hidden;
}

@keyframes bgShift {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1 {
  margin-top:40px;
  font-size:42px;
  font-weight:700;
}

#game-box {
  width:90%;
  max-width:600px;
  margin:40px auto;
  padding:25px;
  background:rgba(255,255,255,0.15);
  border-radius:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.question {
  font-size:24px;
  font-weight:600;
  margin-bottom:25px;
}

.choice-btn {
  display:block;
  width:90%;
  margin:12px auto;
  padding:18px;
  font-size:20px;
  border:none;
  border-radius:15px;
  background:#ffffff;
  color:#333;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

.choice-btn:hover {
  transform:scale(1.05);
  background:#ffe6e6;
}

/* Surprise Mode */
#surprise-content {
  opacity:0;
  pointer-events:none;
  transition:opacity 2s ease;
}

.card {
  background:rgba(255,255,255,0.2);
  padding:30px;
  border-radius:25px;
  width:85%;
  max-width:800px;
  margin:auto;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.card img {
  width:260px;
  height:260px;
  border-radius:50%;
  object-fit:cover;
  opacity:0;
  animation:fadeIn 2s ease forwards, glow 3s ease-in-out infinite alternate;
  border:4px solid #fff;
  box-shadow:0 0 25px rgba(255,255,255,0.7);
}

@keyframes fadeIn {
  from{opacity:0;transform:scale(0.8);}
  to{opacity:1;transform:scale(1);}
}

@keyframes glow {
  from{box-shadow:0 0 15px rgba(255,255,255,0.4);}
  to{box-shadow:0 0 35px rgba(255,255,255,1);}
}

#message {
  font-size:20px;
  line-height:1.8;
  margin-top:20px;
  min-height:200px;
  white-space:pre-wrap;
}

.signature {
  margin-top:15px;
  font-style:italic;
  font-weight:bold;
  color:#fff;
}

/* Fireworks */
canvas {
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
  z-index:0;
}
</style>
</head>

<body>

<h1 id="title">Would You Rather?</h1>

<div id="game-box">
  <div id="question-container"></div>
</div>

<!-- Surprise Content -->
<div id="surprise-content">
  <canvas id="fireworks"></canvas>

  <h1>🎉 Happy Birthday Haridhra 🎉</h1>

  <div class="card">
    <img src="Haridhra.jpg">
    <p id="message"></p>
    <p class="signature">— With all my love, Your Big Brother, Sriram</p>
  </div>

  <audio id="voice" src="https://www.soundjay.com/human/sounds/happy-birthday-01.mp3"></audio>
</div>

<script>
/* FUN WOULD YOU RATHER QUESTIONS */
const questions = [
  {
    q: "Would you rather…",
    a: ["Have unlimited snacks", "Have unlimited holidays"]
  },
  {
    q: "Would you rather…",
    a: ["Be the funniest person in the room", "Be the smartest person in the room"]
  },
  {
    q: "Would you rather…",
    a: ["Travel the world", "Stay home with comfort and peace"]
  },
  {
    q: "Would you rather…",
    a: ["Have a perfect day", "Have a perfect year"]
  },
  {
    q: "Final one… Would you rather choose…",
    a: ["Anyone else", "Haridhra ❤️"]
  }
];

let current = 0;

function loadQuestion(){
  const qBox = document.getElementById("question-container");

  if(current >= questions.length){
    revealSurprise();
    return;
  }

  const q = questions[current];

  qBox.innerHTML = `
    <div class="question">${q.q}</div>
    ${q.a.map(ans => `<button class="choice-btn" onclick="nextQuestion('${ans}')">${ans}</button>`).join("")}
  `;
}

function nextQuestion(choice){
  if(choice.includes("Haridhra")){
    revealSurprise();
    return;
  }
  current++;
  loadQuestion();
}

loadQuestion();

/* SURPRISE REVEAL */
function revealSurprise(){
  document.getElementById("game-box").style.display="none";
  document.getElementById("title").style.display="none";

  const sc = document.getElementById("surprise-content");
  sc.style.opacity = 1;
  sc.style.pointerEvents = "auto";

  startShow();
}

/* TYPEWRITER MESSAGE */
const text = `Looks like no matter what the choices were…

The answer was always going to be you.

Because you ARE the joy.
You ARE the comfort.
You ARE the brightness.
You ARE the favourite choice.

And today…

You deserve the happiest birthday ever.

Happy Birthday, Haridhra ❤️`;

let i = 0;
function typeWriter(){
  if(i < text.length){
    const char = text.charAt(i);
    document.getElementById("message").innerHTML += char === "\n" ? "<br>" : char;
    i++;
    setTimeout(typeWriter, 25);
  }
}

/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.onresize = resizeCanvas;

let fireworks = [];

function createFirework(){
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height/2;
  const colors = ["#ffffff","#ffe066","#00d2ff","#ff4d6d","#ffcf33"];
  for(let i=0;i<40;i++){
    fireworks.push({
      x,y,
      radius:2,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*3+1,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:60
    });
  }
}

function animateFireworks(){
  ctx.fillStyle="rgba(0,0,0,0.1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  fireworks.forEach((f,index)=>{
    f.x+=Math.cos(f.angle)*f.speed;
    f.y+=Math.sin(f.angle)*f.speed;
    f.life--;
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
    ctx.fillStyle=f.color;
    ctx.fill();
    if(f.life<=0) fireworks.splice(index,1);
  });
  requestAnimationFrame(animateFireworks);
}

function startShow(){
  typeWriter();
  document.getElementById("voice").play().catch(()=>{});
  animateFireworks();
  setInterval(createFirework,800);
}
</script>

</body>
</html>
